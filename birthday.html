<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Akka 🎉</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
    }

    .card {
        background: rgba(255, 255, 255, 0.9);
        padding: 50px 70px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        animation: pop 1.5s ease;
    }

    h1 {
        font-size: 3em;
        color: #ff4081;
        margin-bottom: 10px;
    }

    p {
        font-size: 1.4em;
        color: #444;
    }

    button {
        margin-top: 25px;
        padding: 14px 30px;
        font-size: 1.1em;
        border: none;
        border-radius: 30px;
        background: #ff4081;
        color: white;
        cursor: pointer;
        transition: transform 0.2s, background 0.3s;
    }

    button:hover {
        background: #e91e63;
        transform: scale(1.05);
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <p>💖 Sweety Akka 💖</p>
    <p>May your day be filled with love and smiles 🌸</p>

    <button onclick="location.href='surprise.html'">
        🎁 A Small Surprise
    </button>
</div>

</body>
</html>
